name: Publish dashboard data

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release that holds the data assets"
        required: true
        default: "data-v1"
      raw_asset:
        description: "Name of the raw CSV asset inside the release"
        required: true
        default: "creditcard.csv"

jobs:
  prepare-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: publish-data
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify the release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Download the raw base from the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RAW_ASSET: ${{ inputs.raw_asset }}
        run: |
          set -euo pipefail
          mkdir -p data/raw data/processed
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$RAW_ASSET" \
            --dir data/raw \
            --clobber
          test -s "data/raw/$RAW_ASSET"
          if [ "$RAW_ASSET" != "creditcard.csv" ]; then
            mv "data/raw/$RAW_ASSET" data/raw/creditcard.csv
          fi

      - name: Validate the raw CSV
        run: |
          set -euo pipefail
          echo "## Raw CSV" >> "$GITHUB_STEP_SUMMARY"
          echo "- path: data/raw/creditcard.csv" >> "$GITHUB_STEP_SUMMARY"
          echo "- size: $(stat -c%s data/raw/creditcard.csv) bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: $(sha256sum data/raw/creditcard.csv | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          test -s data/raw/creditcard.csv

      - name: Prepare the Parquet base (E2/E3)
        run: uv run credit-card-fraud-pipeline prepare

      - name: Validate the prepared base
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import pandas as pd
          df = pd.read_parquet("data/processed/transactions.parquet")
          assert len(df) > 0, "prepared base is empty"
          assert "Class" in df.columns, "prepared base is missing 'Class'"
          frauds = int(df["Class"].sum())
          assert 0 < frauds < len(df), "unexpected fraud count"
          print(f"rows={len(df)} frauds={frauds}")
          PY
          echo "## Prepared Parquet" >> "$GITHUB_STEP_SUMMARY"
          echo "- path: data/processed/transactions.parquet" >> "$GITHUB_STEP_SUMMARY"
          echo "- size: $(stat -c%s data/processed/transactions.parquet) bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: $(sha256sum data/processed/transactions.parquet | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the prepared base to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            data/processed/transactions.parquet \
            --repo "$GITHUB_REPOSITORY" \
            --clobber