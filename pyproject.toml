[project]
name = "credit-card-fraud"
version = "0.1.0"
description = "Credit card fraud detection project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "plotly>=6.0.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[project.scripts]
credit-card-fraud = "credit_card_fraud.main:main"
credit-card-fraud-pipeline = "credit_card_fraud.cli:main"
credit-card-fraud-dashboard = "credit_card_fraud.cli:open_dashboard"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
